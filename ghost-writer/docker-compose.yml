services:
  ghost-writer:
    image: node:20-alpine
    container_name: ghost-writer
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && node server.js"
    ports:
      - "2369:2369"
    environment:
      PORT: 2369
      NODE_ENV: production
      GHOST_URL: ${GHOST_URL}
      GHOST_ADMIN_API_KEY: ${GHOST_ADMIN_API_KEY}
      SESSION_SECRET: ${SESSION_SECRET}
    volumes:
      - ${GHOST_WRITER_APP_PATH}:/app
    extra_hosts:
      - "${GHOST_HOST}:${HOST_LAN_IP}"
    networks:
      - ${DOCKER_NETWORK}

networks:
  ${DOCKER_NETWORK}:
    external: true
