services:

  ghost:
    image: ghost:5-alpine
    container_name: ghost
    restart: unless-stopped
    depends_on:
      ghost-db:
        condition: service_healthy
    ports:
      - "2368:2368"
    environment:
      # --- Core ---
      NODE_ENV: production
      url: ${GHOST_URL}

      # --- Proxy trust (tells Ghost it's behind Cloudflare/NPM) ---
      privacy__useUpdateCheck: "false"
      server__host: "0.0.0.0"
      server__port: 2368

      # --- Database ---
      database__client: mysql
      database__connection__host: ghost-db
      database__connection__port: 3306
      database__connection__user: ghost
      database__connection__password: ${GHOST_DB_PASSWORD}
      database__connection__database: ghost

# --- Mail (Mailgun SMTP) ---
      mail__transport: SMTP
      mail__options__service: Mailgun
      mail__options__host: smtp.mailgun.org
      mail__options__port: 587
      mail__options__secure: "false"
      mail__options__auth__user: ${MAILGUN_SMTP_USER}
      mail__options__auth__pass: ${MAILGUN_SMTP_PASSWORD}
      mail__from: ${GHOST_MAIL_FROM}

      # --- Members (invite-only) ---
      members__enabled: "true"
      members__signup__allow: "false"

    volumes:
      - ${GHOST_CONTENT_PATH}:/var/lib/ghost/content
    networks:
      - ${DOCKER_NETWORK}

  ghost-db:
    image: mysql:8.0
    container_name: ghost-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ghost
      MYSQL_USER: ghost
      MYSQL_PASSWORD: ${GHOST_DB_PASSWORD}
    volumes:
      - ${MYSQL_DATA_PATH}:/var/lib/mysql
    networks:
      - ${DOCKER_NETWORK}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "ghost", "--password=${GHOST_DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  ${DOCKER_NETWORK}:
    external: true
